name: Contribute labeled videos
description: Add YouTube videos with a known answer (AI or real) to the test set. No coding needed.
title: "[videos] "
labels: ["dataset"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! We need **500+ public YouTube videos where we know for sure** whether they're AI-generated or real.
        Please read [CONTRIBUTING-VIDEOS.md](../blob/main/CONTRIBUTING-VIDEOS.md) first. The key rule is **evidence, not guesses**.
  - type: textarea
    id: rows
    attributes:
      label: Videos (one per line)
      description: |
        Format: `video_id,truth,group,youtube_label,evidence_url`
        - truth: `ai` or `real`
        - group: english-pro, non-english, phone-lowlight, animation-cgi, music-filtered, news, shorts, other
        - youtube_label: `1` if YouTube shows "Altered or synthetic content" on the video, else `0`
        - evidence_url: a link proving how you know (no commas in any field)
      placeholder: |
        abcDEF12345,ai,shorts,1,https://example.com/creator-says-made-with-veo
        xyzXYZ98765,real,news,0,https://example.com/original-broadcast
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirm
      options:
        - label: Every video is public, and I have evidence for each label (not a hunch or a detector score)
          required: true
        - label: I am not labeling anyone's video as AI to harass or discredit them
          required: true
